[profile.default]
src = "src"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.23"
auto_detect_solc = false
optimizer = true
optimizer_runs = 1_000_000
evm_version = "shanghai"
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
arc-mainnet = "${ARC_MAINNET_RPC_URL}"
arc-testnet = "${ARC_TESTNET_RPC_URL}"
